<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Aprender Brincando</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #fff09b;
    color: #4A3B52;
    padding: 20px;
  }

  h1, h2 {
    text-align: center;
  }

  .foto {
    width: 140px;
    height: 140px;
    background-color: #ffd6d6;
    border: 2px dashed gray;
    border-radius: 100px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: gray;
  }

  .texto-centro {
    text-align: center;
  }

  .niveis {
    text-align: center;
    margin-top: 20px;
  }

  .nivel {
    background-color: white;
    border: 2px solid gray;
    border-radius: 12px;
    padding: 10px;
    margin: 8px;
    width: 170px;
    cursor: pointer;
    display: inline-block;
  }

  .ativo {
    background-color: #ffe7a3;
    border-color: orange;
  }

  .foto-nivel {
    width: 70px;
    height: 70px;
    background-color: #eeeeee;
    border-radius: 50%;
    margin: auto;
    margin-bottom: 8px;
    overflow: hidden;
  }

  .foto-nivel img {
    width: 70px;
    height: 70px;
  }

  .caixa {
    background-color: white;
    border: 2px solid #dddddd;
    border-radius: 12px;
    padding: 15px;
    margin-top: 25px;
  }

  select {
    padding: 7px;
    font-size: 16px;
  }

  ul {
    padding: 0;
  }

  li {
    list-style: none;
    background-color: #fff8ec;
    margin: 6px;
    padding: 10px;
    border-radius: 8px;
    text-align: center;
  }

  .lista {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
  }

  .palavras {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
  }

  .emoji {
    font-size: 35px;
  }
</style>
</head>

<body>

<div class="foto">
  Colocar<br>foto aqui
</div>

<h1>Aprender Brincando</h1>

<p class="texto-centro">
  Atividade de tabuada e escrita
</p>

<p class="texto-centro">
  Escolha o nível:
</p>

<div class="niveis">

  <button class="nivel ativo" onclick="mudarNivel(this, 'facil')">
    <div class="foto-nivel">
      <img src="Joaninha-Joaninha-nível-1.jpg">
    </div>
    😊 Tô começando
  </button>

  <button class="nivel" onclick="mudarNivel(this, 'medio')">
    <div class="foto-nivel">
      <img src="Joaninha-Joaninha-nível-2.jpg">
    </div>
    🙂 Já sei um pouco
  </button>

  <button class="nivel" onclick="mudarNivel(this, 'dificil')">
    <div class="foto-nivel">
      <img src="Joaninha-Joaninha-nível-3.jpg">
    </div>
    😎 Já sou fera
  </button>

</div>

<div class="caixa">
  <h2>Tabuada</h2>

  <p>Escolha um número:</p>

  <select id="numero" onchange="mostrarTabuada()"></select>

  <ul class="lista" id="lista"></ul>
</div>

<div class="caixa">
  <h2>Escrita</h2>

  <p>Palavras para treinar:</p>

  <ul class="palavras" id="palavras"></ul>
</div>

<script>
  var nivel = "facil";

  var palavrasFacil = [
    ["gato", "🐱"],
    ["casa", "🏠"],
    ["sol", "☀️"],
    ["lua", "🌙"]
  ];

  var palavrasMedio = [
    ["cachorro", "🐶"],
    ["escola", "🏫"],
    ["sorvete", "🍦"],
    ["girafa", "🦒"]
  ];

  var palavrasDificil = [
    ["aquarela", "🎨"],
    ["biblioteca", "📚"],
    ["astronauta", "👨‍🚀"]
  ];

  function mudarNivel(botao, novoNivel) {
    var botoes = document.querySelectorAll(".nivel");

    for (var i = 0; i < botoes.length; i++) {
      botoes[i].classList.remove("ativo");
    }

    botao.classList.add("ativo");
    nivel = novoNivel;

    mostrarTabuada();
    mostrarPalavras();
  }

  function colocarNumeros() {
    var numero = document.getElementById("numero");

    for (var i = 1; i <= 10; i++) {
      numero.innerHTML += "<option>" + i + "</option>";
    }
  }

  function mostrarTabuada() {
    var numero = document.getElementById("numero").value;
    var lista = document.getElementById("lista");
    var limite = 5;

    if (nivel == "medio") {
      limite = 10;
    }

    if (nivel == "dificil") {
      limite = 12;
    }

    lista.innerHTML = "";

    for (var i = 1; i <= limite; i++) {
      lista.innerHTML += "<li>" + numero + " x " + i + " = " + (numero * i) + "</li>";
    }
  }

  function mostrarPalavras() {
    var lista = document.getElementById("palavras");
    var palavras = palavrasFacil;

    if (nivel == "medio") {
      palavras = palavrasMedio;
    }

    if (nivel == "dificil") {
      palavras = palavrasDificil;
    }

    lista.innerHTML = "";

    for (var i = 0; i < palavras.length; i++) {
      lista.innerHTML +=
        "<li>" +
        "<div class='emoji'>" + palavras[i][1] + "</div>" +
        "<strong>" + palavras[i][0] + "</strong>" +
        "</li>";
    }
  }

  colocarNumeros();
  mostrarTabuada();
  mostrarPalavras();
</script>

</body>
</html>
